name: MATLAB

on:
  push:
    paths: ["src/**", "tests/**", "config/**", "data/splits/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      experiment:
        description: Run
        type: choice
        default: checks
        required: true
        options: [checks, development, reproduce-final]

permissions:
  contents: read

env:
  EXPERIMENT: ${{ inputs.experiment || 'checks' }}

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: >
            Audio_Toolbox
            Signal_Processing_Toolbox
            Deep_Learning_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath("src"); results = runtests("tests"); assertSuccess(results)

      - name: Download MUSAN
        if: env.EXPERIMENT != 'checks'
        shell: bash
        run: |
          mkdir -p data
          curl --fail --location https://www.openslr.org/resources/17/musan.tar.gz \
            | tar -xz -C data --wildcards 'musan/speech/*' 'musan/music/*'
          for kind in speech music; do
            test -n "$(find "data/musan/$kind" -type f -iname '*.wav' -print -quit)"
          done

      - name: Run experiment
        if: env.EXPERIMENT != 'checks'
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath("src");
            if strcmp(getenv("EXPERIMENT"),"development"),
              create_source_split;
              preliminary_mixture_demo(ResultsDir="results/run");
            else,
              run_final_experiment(DryRun=false,ResultsDir="results/run");
              addpath("tests/helpers"); check_reproduction("results/run");
            end

      - name: Save outputs
        if: env.EXPERIMENT != 'checks'
        uses: actions/upload-artifact@v4
        with:
          name: presence-${{ env.EXPERIMENT }}
          if-no-files-found: error
          path: |
            data/splits/source_split.csv
            results/run/*.csv
            results/run/*.json
            results/run/*models.mat
            results/run/preliminary_figures/*.png
            results/run/preliminary_audio/pair_${{ inputs.experiment == 'development' && '01' || '11' }}_*.wav
            results/run/preliminary_audio/SOURCES.txt
            results/run/preliminary_audio/attribution/
